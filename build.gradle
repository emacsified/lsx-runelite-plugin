plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'ge.lsx'
version = '1.1.0'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

// `gradlew run` launches RuneLite in developer mode with this plugin loaded.
tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Launch RuneLite with the Lumbridge Stock Exchange plugin (developer mode)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ge.lsx.LsxPluginTest'
    jvmArgs '-ea'
    args '--developer-mode'
    // Optional isolated RuneLite home for testing: gradlew run -PrlHome=/some/dir
    if (project.hasProperty('rlHome')) {
        jvmArgs "-Duser.home=${project.property('rlHome')}"
        args '--debug'
    }
    // Point the dev client at another LSX server, e.g. a local one: gradlew run -PlsxApi=http://127.0.0.1:8077
    if (project.hasProperty('lsxApi')) {
        jvmArgs "-Dlsx.apiUrl=${project.property('lsxApi')}"
    }
}

tasks.named('compileJava') {
    options.compilerArgs += ['-Xlint:deprecation']
}
